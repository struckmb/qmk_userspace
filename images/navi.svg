<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 824 390" role="img" aria-labelledby="title desc">
  <title id="title">NAVI-Ebene mit Haupt- und Daumentasten</title>
  <desc id="desc">Dreireihige Navigationsbelegung mit optionalen äußeren Spalten und Media-Tasten am rechten Rand. Darunter die logischen Daumentasten.</desc>
  <style>
    text { font-family: system-ui, sans-serif; fill: #20232a; }
    .hand { font-size: 13px; font-weight: 700; letter-spacing: .08em; fill: #566174; }
    .key rect { fill: #f5f7fa; stroke: #667085; stroke-width: 1.5; rx: 7; }
    .key .label, .thumb-label { font-size: 19px; font-weight: 650; text-anchor: middle; }
    .key .hint, .thumb-hint { font-size: 8px; text-anchor: middle; fill: #596579; }
    .optional rect { fill: #fff7df; stroke: #b7791f; stroke-dasharray: 5 3; }
    .optional .hint { fill: #805b16; }
    .inactive rect { fill: #f1f2f4; stroke: #9aa1ab; stroke-dasharray: 3 3; }
    .optional.inactive rect { fill: #fff7df; stroke: #b7791f; stroke-dasharray: 5 3; }
    .inactive .label { fill: #77808c; }
    .thumb rect { fill: #eaf2ff; stroke: #5576a8; }
    .thumb.optional rect { fill: #fff7df; stroke: #b7791f; stroke-dasharray: 5 3; }
    .pass-through rect { fill: #f1f2f4; stroke: #9aa1ab; stroke-dasharray: 3 3; }
    
    .section { font-size: 12px; font-weight: 700; fill: #566174; }
    .note { font-size: 11px; fill: #596579; }
  </style>
  <text class="hand" x="20" y="18">LINKE HAND · AUSSEN NACH INNEN</text>
  <text class="hand" x="428" y="18">RECHTE HAND · INNEN NACH AUSSEN</text>
