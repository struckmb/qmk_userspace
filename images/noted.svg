<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 824 390" role="img" aria-labelledby="title desc">
  <title id="title">NOTED-Ebene mit Haupt- und Daumentasten</title>
  <desc id="desc">Dreireihige, geteilte Tastaturbelegung. Die gestrichelten äußeren Spalten sind optional. Darunter sind die sechs logischen Daumenpositionen.</desc>
  <style>
    text { font-family: system-ui, sans-serif; fill: #20232a; }
    .hand { font-size: 13px; font-weight: 700; letter-spacing: .08em; fill: #566174; }
    .key rect { fill: #f5f7fa; stroke: #667085; stroke-width: 1.5; rx: 7; }
    .key .label { font-size: 19px; font-weight: 650; text-anchor: middle; }
    .key .hint { font-size: 8px; text-anchor: middle; fill: #596579; }
    .optional rect { fill: #fff7df; stroke: #b7791f; stroke-dasharray: 5 3; }
    .optional .hint { fill: #805b16; }
    .thumb rect { fill: #eaf2ff; stroke: #5576a8; }
    .thumb.optional rect { fill: #fff7df; stroke: #b7791f; stroke-dasharray: 5 3; }
    .pass-through rect { fill: #f1f2f4; stroke: #9aa1ab; stroke-dasharray: 3 3; }
    .thumb-label { font-size: 19px; font-weight: 650; text-anchor: middle; }
    .thumb-hint { font-size: 8px; text-anchor: middle; fill: #596579; }
    .section { font-size: 12px; font-weight: 700; fill: #566174; }
    .note { font-size: 11px; fill: #596579; }
  </style>
  <text class="hand" x="20" y="18">LINKE HAND · AUSSEN NACH INNEN</text>
  <text class="hand" x="428" y="18">RECHTE HAND · INNEN NACH AUSSEN</text>
  <g class="key optional" transform="translate(20 30)"><rect width="56" height="54"/><text class="label" x="28" y="34">⌫</text><text class="hint" x="28" y="48">Alt</text></g>
  <g class="key" transform="translate(84 30)"><rect width="56" height="54"/><text class="label" x="28" y="34">Z</text></g>
  <g class="key" transform="translate(148 30)"><rect width="56" height="54"/><text class="label" x="28" y="34">Y</text></g>
  <g class="key" transform="translate(212 30)"><rect width="56" height="54"/><text class="label" x="28" y="34">U</text></g>
  <g class="key" transform="translate(276 30)"><rect width="56" height="54"/><text class="label" x="28" y="34">A</text></g>
  <g class="key" transform="translate(340 30)"><rect width="56" height="54"/><text class="label" x="28" y="34">Q</text></g>
  <g class="key" transform="translate(428 30)"><rect width="56" height="54"/><text class="label" x="28" y="34">P</text></g>
  <g class="key" transform="translate(492 30)"><rect width="56" height="54"/><text class="label" x="28" y="34">B</text></g>
  <g class="key" transform="translate(556 30)"><rect width="56" height="54"/><text class="label" x="28" y="34">M</text></g>
  <g class="key" transform="translate(620 30)"><rect width="56" height="54"/><text class="label" x="28" y="34">L</text></g>
  <g class="key" transform="translate(684 30)"><rect width="56" height="54"/><text class="label" x="28" y="34">F</text></g>
  <g class="key optional" transform="translate(748 30)"><rect width="56" height="54"/><text class="label" x="28" y="34">J</text><text class="hint" x="28" y="48">Alt</text></g>

  <g class="key optional" transform="translate(20 94)"><rect width="56" height="54"/><text class="label" x="28" y="34">⎋</text><text class="hint" x="28" y="48">SYMB</text></g>
  <g class="key" transform="translate(84 94)"><rect width="56" height="54"/><text class="label" x="28" y="34">C</text><text class="hint" x="28" y="48">GUI</text></g>
  <g class="key" transform="translate(148 94)"><rect width="56" height="54"/><text class="label" x="28" y="34">S</text><text class="hint" x="28" y="48">Alt</text></g>
  <g class="key" transform="translate(212 94)"><rect width="56" height="54"/><text class="label" x="28" y="34">I</text><text class="hint" x="28" y="48">Shift</text></g>
  <g class="key" transform="translate(276 94)"><rect width="56" height="54"/><text class="label" x="28" y="34">E</text><text class="hint" x="28" y="48">Ctrl</text></g>
  <g class="key" transform="translate(340 94)"><rect width="56" height="54"/><text class="label" x="28" y="34">O</text><text class="hint" x="28" y="48">SYMB**</text></g>
  <g class="key" transform="translate(428 94)"><rect width="56" height="54"/><text class="label" x="28" y="34">D</text><text class="hint" x="28" y="48">SYMB**</text></g>
  <g class="key" transform="translate(492 94)"><rect width="56" height="54"/><text class="label" x="28" y="34">T</text><text class="hint" x="28" y="48">Ctrl</text></g>
  <g class="key" transform="translate(556 94)"><rect width="56" height="54"/><text class="label" x="28" y="34">N</text><text class="hint" x="28" y="48">Shift</text></g>
  <g class="key" transform="translate(620 94)"><rect width="56" height="54"/><text class="label" x="28" y="34">R</text><text class="hint" x="28" y="48">Alt</text></g>
  <g class="key" transform="translate(684 94)"><rect width="56" height="54"/><text class="label" x="28" y="34">H</text><text class="hint" x="28" y="48">GUI</text></g>
  <g class="key optional" transform="translate(748 94)"><rect width="56" height="54"/><text class="label" x="28" y="34">ß</text><text class="hint" x="28" y="48">SYMB</text></g>

  <g class="key optional" transform="translate(20 158)"><rect width="56" height="54"/><text class="label" x="28" y="34">⇧</text></g>
  <g class="key" transform="translate(84 158)"><rect width="56" height="54"/><text class="label" x="28" y="34">V</text></g>
  <g class="key" transform="translate(148 158)"><rect width="56" height="54"/><text class="label" x="28" y="34">X</text></g>
  <g class="key" transform="translate(212 158)"><rect width="56" height="54"/><text class="label" x="28" y="34">Ü</text></g>
  <g class="key" transform="translate(276 158)"><rect width="56" height="54"/><text class="label" x="28" y="34">Ä</text></g>
  <g class="key" transform="translate(340 158)"><rect width="56" height="54"/><text class="label" x="28" y="34">Ö</text></g>
  <g class="key" transform="translate(428 158)"><rect width="56" height="54"/><text class="label" x="28" y="34">W</text></g>
  <g class="key" transform="translate(492 158)"><rect width="56" height="54"/><text class="label" x="28" y="34">G</text></g>
  <g class="key" transform="translate(556 158)"><rect width="56" height="54"/><text class="label" x="28" y="34">,</text></g>
  <g class="key" transform="translate(620 158)"><rect width="56" height="54"/><text class="label" x="28" y="34">.</text></g>
  <g class="key" transform="translate(684 158)"><rect width="56" height="54"/><text class="label" x="28" y="34">K</text></g>
  <g class="key optional" transform="translate(748 158)"><rect width="56" height="54"/><text class="label" x="28" y="34">App</text><text class="hint" x="28" y="48">Ctrl</text></g>

  <text class="section" x="20" y="238">Gestrichelt = optionale Rand-/3. Daumentaste</text>
  <text class="section" x="20" y="270">DAUMEN · LOGISCHE REIHENFOLGE, PHYSISCHE ANORDNUNG VARIIERT</text>
  <text class="note" x="20" y="298">Links außen → innen</text>
  <text class="note" x="428" y="298">Rechts innen → außen</text>
  <g class="key thumb optional" transform="translate(148 307)"><rect width="77.333" height="48"/><text class="thumb-label" x="38.667" y="30">⎋</text><text class="thumb-hint" x="38.667" y="44">NAVI</text></g>
  <g class="key thumb" transform="translate(233.333 307)"><rect width="77.333" height="48"/><text class="thumb-label" x="38.667" y="30">↵</text><text class="thumb-hint" x="38.667" y="44">GUI</text></g>
  <g class="key thumb" transform="translate(318.667 307)"><rect width="77.333" height="48"/><text class="thumb-label" x="38.667" y="30">⇥</text><text class="thumb-hint" x="38.667" y="44">NUMS</text></g>
  <g class="key thumb" transform="translate(428 307)"><rect width="77.333" height="48"/><text class="thumb-label" x="38.667" y="30">⌫</text><text class="thumb-hint" x="38.667" y="44">NAVI</text></g>
  <g class="key thumb" transform="translate(513.333 307)"><rect width="77.333" height="48"/><text class="thumb-label" x="38.667" y="30">␣</text></g>
  <g class="key thumb optional" transform="translate(598.667 307)"><rect width="77.333" height="48"/><text class="thumb-label" x="38.667" y="30">⌦</text><text class="thumb-hint" x="38.667" y="44">NUMS</text></g>
</svg>
